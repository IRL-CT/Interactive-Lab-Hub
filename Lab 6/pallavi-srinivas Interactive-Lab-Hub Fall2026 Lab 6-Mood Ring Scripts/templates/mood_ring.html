<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mood Ring</title>
    <script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: radial-gradient(circle at top, #2a241c 0%, #100e0c 70%);
            color: #f4efe4;
            font-family: Georgia, 'Times New Roman', serif;
            padding: 24px;
        }

        .stage { text-align: center; width: min(92vw, 560px); }

        h1 {
            font-weight: normal;
            letter-spacing: 0.18em;
            text-transform: uppercase;
            font-size: 14px;
            color: #d9c48a;
            margin-bottom: 28px;
        }

        .band {
            width: min(78vw, 380px);
            height: min(78vw, 380px);
            margin: 0 auto 28px;
            border-radius: 50%;
            display: grid;
            place-items: center;
            background: conic-gradient(from 120deg, #7a6234, #f6e7b2, #5c4724, #fff4cc, #7a6234);
            box-shadow: 0 24px 50px rgba(0, 0, 0, 0.45);
        }

        .gem {
            width: 64%;
            height: 64%;
            border-radius: 50%;
            background: #2a2a2a;
            position: relative;
            display: grid;
            place-items: center;
            box-shadow: inset 0 0 40px rgba(0, 0, 0, 0.5), 0 0 0 7px #241c10;
            transition: background-color 0.45s ease;
            overflow: hidden;
        }

        .shine {
            position: absolute;
            width: 46%;
            height: 22%;
            top: 16%;
            left: 18%;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.38);
            transform: rotate(-28deg);
        }

        #label {
            position: relative;
            font-size: 22px;
            letter-spacing: 0.04em;
        }

        #count {
            font-size: 20px;
            margin-bottom: 6px;
        }

        #rgb {
            font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
            color: #cbbd9a;
            margin-bottom: 22px;
        }

        #devices {
            display: flex;
            justify-content: center;
            gap: 18px;
            flex-wrap: wrap;
        }

        .device { width: 84px; }

        .swatch {
            width: 64px;
            height: 64px;
            border-radius: 50%;
            margin: 0 auto 8px;
            box-shadow: inset 0 0 12px rgba(0, 0, 0, 0.35);
            border: 2px solid rgba(255, 255, 255, 0.25);
        }

        .name { font-size: 14px; color: #e7dcc4; }
    </style>
</head>
<body>
    <div class="stage">
        <h1>Mood Ring</h1>
        <div class="band">
            <div class="gem" id="gem">
                <div class="shine"></div>
                <p id="label">waiting</p>
            </div>
        </div>
        <p id="count">No Pis yet</p>
        <p id="rgb"></p>
        <div id="devices"></div>
    </div>

    <script>
        const gem = document.getElementById('gem');
        const label = document.getElementById('label');
        const count = document.getElementById('count');
        const rgb = document.getElementById('rgb');
        const devices = document.getElementById('devices');

        function ink(r, g, b) {
            return (0.299 * r + 0.587 * g + 0.114 * b) > 150 ? '#1c140c' : '#f7f1e6';
        }

        function render(state) {
            devices.innerHTML = '';
            if (!state.average) {
                gem.style.background = '#2a2a2a';
                label.textContent = 'waiting';
                label.style.color = '#f7f1e6';
                count.textContent = 'No Pis yet';
                rgb.textContent = '';
                return;
            }

            const [r, g, b] = state.average;
            gem.style.background = `rgb(${r}, ${g}, ${b})`;
            label.style.color = ink(r, g, b);
            label.textContent = 'mood';
            const noun = state.count === 1 ? 'Pi' : 'Pis';
            count.textContent = `Average of ${state.count} ${noun}`;
            rgb.textContent = `RGB(${r}, ${g}, ${b})`;

            state.devices.forEach((device) => {
                const card = document.createElement('div');
                card.className = 'device';
                const swatch = document.createElement('div');
                swatch.className = 'swatch';
                swatch.style.background = `rgb(${device.r}, ${device.g}, ${device.b})`;
                const name = document.createElement('div');
                name.className = 'name';
                name.textContent = device.id;
                card.appendChild(swatch);
                card.appendChild(name);
                devices.appendChild(card);
            });
        }

        const socket = io();
        socket.on('mood', render);
        fetch('/state').then((response) => response.json()).then(render);
    </script>
</body>
</html>
